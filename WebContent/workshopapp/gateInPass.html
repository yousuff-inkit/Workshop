	<script>
		$(document).ready(function(){
			
				var gipform=$('#frmappgateinpass');
			    gipform.steps({

			        bodyTag: "fieldset",
			        transitionEffect: "slideLeft",
			        labels: {
			            previous: 'Previous',
			            next: 'Next',
			            finish: 'Submit',
			            current: ''
			        },
			        titleTemplate: '<div class="title"><span class="number">#index#</span>#title#</div>',
			        onStepChanging: function(event, currentIndex, newIndex) {
			            //form.validate().settings.ignore = ":disabled,:hidden";
			            // console.log(form.steps("getCurrentIndex"));
			            //return form.valid();
			        	return true;
			        },
			        onFinishing: function(event, currentIndex) {

			            //console.log(getCurrentIndex);
			            //return form.valid();
			        	return true;
			        },
			        onFinished: function(event, currentIndex) {
			            alert('Sumited');
			        }
			        // onInit : function (event, currentIndex) {
			        //     event.append('demo');
			        // }
			    });

		    $('.searchlist li a').click(function(){
		    	var value=$(this).text();
		    	$(this).closest('.form-group-w').find('input').val(value);
		    	$(this).closest('.searchlist').toggleClass('hidden');
		    	return false;
		    });
		});
		function getInitData(){
			var x = new XMLHttpRequest();
	  		x.onreadystatechange = function() {
	  			if (x.readyState == 4 && x.status == 200) {
	  				var items = x.responseText.trim();
	  				items=JSON.parse(items);
	  				var htmldata='';
	  				$.each(items.platedata,function(index,value){
	  					htmldata+='<li class="list-group-item" data-docno="'+value.docno+'">'+value.refname+'</li>';
	  				});
	  				
	  			}
	  		}
	  		x.open("GET", "getInitData.jsp", true);
	  		x.send();
		}
	</script>
